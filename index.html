<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src https: data:; script-src 'self' 'unsafe-inline';">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/webp" href="favicon.webp"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Italiana&display=swap" rel="stylesheet"/>
<title>GitHunt</title>
<style>
:root {
  --bg:    #050508;
  --bg1:   #08080d;
  --bg2:   #0d0d14;
  --bg3:   #121219;
  --bg4:   #18181f;
  --red:        #e8192c;
  --red-bright: #ff2d42;
  --red-dim:    rgba(232,25,44,0.07);
  --red-dim2:   rgba(232,25,44,0.14);
  --red-glow:   rgba(232,25,44,0.3);
  --border:     rgba(232,25,44,0.09);
  --border2:    rgba(232,25,44,0.2);
  --border3:    rgba(232,25,44,0.42);
  --platinum: #eeeef5;
  --silver:   #8888a0;
  --muted:    #48485e;
  --faint:    #22222e;
  --success:  #00e5a0;
  --danger:   #ff2d42;
  --danger-dim: rgba(255,45,66,0.08);
  --warn:     #ffaa00;
  --sans: 'Space Grotesk', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --sig: 'Italiana', serif;
  --r:    12px;
  --r-sm: 7px;
  --t:    0.15s ease;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--platinum);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;flex-direction:column;
  overflow-x:hidden;
}

/* Subtle grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(232,25,44,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,25,44,0.03) 1px,transparent 1px);
  background-size:52px 52px;
  pointer-events:none;z-index:0;
}

/* Ambient glow */
body::after{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 65% 30% at 50% -2%,rgba(232,25,44,0.11) 0%,transparent 70%),
    radial-gradient(ellipse 35% 20% at 95% 95%,rgba(232,25,44,0.06) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}

/* ═══ HEADER ═══ */
header{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:56px;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,8,0.9);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.logo{
  font-family:var(--mono);font-size:0.9rem;font-weight:700;
  letter-spacing:0.1em;
  display:flex;align-items:center;gap:10px;user-select:none;
}
.logo-mark{
  position:relative;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
}
.logo-mark::before{
  content:'';position:absolute;inset:0;
  border:1.5px solid var(--red);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  animation:hexSpin 10s linear infinite;
  filter:drop-shadow(0 0 4px var(--red-glow));
}
@keyframes hexSpin{to{transform:rotate(360deg)}}
.logo-mark-inner{font-size:0.68rem;font-weight:700;color:var(--red);z-index:1}
.logo-name{color:var(--red);letter-spacing:0.12em;text-shadow:0 0 18px rgba(232,25,44,0.4)}
.logo-dim{color:var(--muted)}

.header-right{display:flex;align-items:center;gap:8px}

.rate-chip{
  display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:0.63rem;color:var(--muted);
  padding:5px 10px;border:1px solid var(--border);border-radius:99px;
  background:var(--bg2);
}
.rate-dot{width:5px;height:5px;border-radius:50%;background:var(--success)}
.rate-dot.warn{background:var(--warn)}
.rate-dot.danger{background:var(--danger)}

/* ═══ BUTTONS ═══ */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--r-sm);
  border:none;cursor:pointer;
  font-family:var(--mono);font-size:0.7rem;font-weight:700;
  letter-spacing:0.06em;
  transition:all var(--t);white-space:nowrap;text-decoration:none;
}
.btn:active{transform:scale(0.96)}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.btn-red{
  background:var(--red);color:#fff;font-weight:700;
  box-shadow:0 0 18px rgba(232,25,44,0.3),inset 0 1px 0 rgba(255,255,255,0.15);
}
.btn-red:hover{
  background:var(--red-bright);
  box-shadow:0 0 30px rgba(232,25,44,0.5),inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-red:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none}

.btn-outline{
  background:transparent;color:var(--silver);
  border:1px solid var(--border2);
}
.btn-outline:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.btn-outline.active{border-color:var(--red);color:var(--red);background:var(--red-dim)}

.btn-fav{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);padding:6px 14px;
}
.btn-fav:hover{border-color:var(--warn);color:var(--warn);background:rgba(255,170,0,0.06)}
.btn-fav.is-fav{color:var(--warn);border-color:rgba(255,170,0,0.35);background:rgba(255,170,0,0.06)}

.btn-sm{padding:5px 10px;font-size:0.63rem}
.btn-danger-soft{
  background:transparent;color:var(--danger);
  border:1px solid rgba(255,45,66,0.2);
}
.btn-danger-soft:hover{background:var(--danger-dim);border-color:var(--danger)}

.badge{
  background:var(--red);color:#fff;
  font-family:var(--mono);font-size:0.58rem;font-weight:700;
  padding:2px 6px;border-radius:99px;min-width:16px;text-align:center;
}

/* ═══ MAIN ═══ */
main{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;
  max-width:800px;width:100%;margin:0 auto;
  padding:2rem 1.5rem 5rem;gap:1rem;
}

/* ═══ SEARCH ═══ */
.search-bar{display:flex;gap:8px;width:100%}
.search-wrap{position:relative;flex:1;min-width:0}
.search-prefix{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:0.88rem;color:var(--red);
  pointer-events:none;z-index:1;font-weight:700;
}
#search-input{
  width:100%;padding:11px 14px 11px 34px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r-sm);color:var(--platinum);
  font-family:var(--mono);font-size:0.84rem;outline:none;
  transition:border-color var(--t),box-shadow var(--t),background var(--t);
}
#search-input::placeholder{color:var(--faint)}
#search-input:focus{
  border-color:var(--red);background:var(--bg3);
  box-shadow:0 0 0 3px rgba(232,25,44,0.1),0 0 20px rgba(232,25,44,0.07);
}

.hist-drop{
  position:absolute;top:calc(100% + 5px);left:0;right:0;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r-sm);z-index:50;overflow:hidden;display:none;
}
.hist-drop.open{display:block}
.hist-label{
  padding:5px 12px;font-size:0.59rem;color:var(--faint);
  text-transform:uppercase;letter-spacing:0.1em;
  font-family:var(--mono);background:var(--bg3);border-bottom:1px solid var(--border);
}
.hist-item{
  padding:8px 12px;font-family:var(--mono);font-size:0.75rem;color:var(--silver);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);transition:background var(--t),color var(--t);
}
.hist-item:last-child{border-bottom:none}
.hist-item:hover{background:var(--bg4);color:var(--red)}
.hist-item span{font-size:0.58rem;opacity:0.3}

/* ═══ VIEWS ═══ */
.view{display:none}
.view.active{display:block;animation:fadeUp 0.22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── WELCOME ── */
#view-welcome{text-align:center;padding:4rem 1rem 2.5rem}

.welcome-emblem{
  width:80px;height:80px;margin:0 auto 2rem;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.emblem-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(232,25,44,0.35);
  animation:pulsRing 3s ease-in-out infinite;
}
.emblem-ring2{
  position:absolute;inset:12px;border-radius:50%;
  border:1px solid rgba(232,25,44,0.2);
  animation:pulsRing 3s ease-in-out infinite 0.6s;
}
@keyframes pulsRing{
  0%,100%{opacity:0.4;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}
.emblem-core{
  width:38px;height:38px;border-radius:50%;
  background:var(--red-dim2);border:1px solid var(--red);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:0.76rem;font-weight:700;color:var(--red);
  z-index:1;box-shadow:0 0 20px rgba(232,25,44,0.25);
}

#view-welcome h1{
  font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;
  letter-spacing:-0.04em;line-height:1.15;
  margin-bottom:1rem;color:var(--platinum);
}
#view-welcome h1 .hl{
  color:var(--red);text-shadow:0 0 40px rgba(232,25,44,0.45);
}
#view-welcome p{
  color:var(--muted);font-family:var(--mono);font-size:0.8rem;
  line-height:1.75;max-width:360px;margin:0 auto;
}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2rem}
.feat-box{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;text-align:center;
  transition:border-color var(--t),background var(--t);
}
.feat-box:hover{border-color:var(--border2);background:var(--bg3)}
.feat-icon{font-family:var(--mono);font-size:0.9rem;color:var(--red);margin-bottom:7px;font-weight:700}
.feat-label{font-family:var(--mono);font-size:0.63rem;color:var(--muted);letter-spacing:0.07em;text-transform:uppercase}

/* ── LOADING ── */
#view-loading{display:none;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;gap:1.25rem}
#view-loading.active{display:flex}
.loader-ring{
  width:40px;height:40px;border:1.5px solid var(--border);
  border-top-color:var(--red);border-right-color:rgba(232,25,44,0.3);
  border-radius:50%;animation:spin 0.65s linear infinite;
  box-shadow:0 0 14px rgba(232,25,44,0.18);
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-family:var(--mono);font-size:0.68rem;color:var(--red);letter-spacing:0.14em;text-transform:uppercase;opacity:0.7}

/* ── ERROR ── */
#view-error{display:none;align-items:center;justify-content:center;padding:3rem 1rem}
#view-error.active{display:flex}
.error-box{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid rgba(255,45,66,0.18);
  border-radius:var(--r);padding:2rem 2.5rem;text-align:center;max-width:360px;
}
.error-icon{
  width:38px;height:38px;border-radius:50%;
  background:var(--danger-dim);border:1px solid rgba(255,45,66,0.22);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:0.9rem;color:var(--danger);
}
.error-msg{font-family:var(--mono);color:var(--danger);font-size:0.8rem;line-height:1.6}

/* ═══ PROFILE CARD ═══ */
.profile-card{
  background:var(--bg1);border:1px solid var(--border2);
  border-radius:var(--r);overflow:hidden;position:relative;
}
.profile-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,var(--red) 40%,rgba(232,25,44,0.4) 65%,transparent 95%);
}

.card-header{padding:1.5rem 1.5rem 0}
.profile-top{display:flex;align-items:flex-start;gap:1.25rem;margin-bottom:1.1rem}

.avatar-wrap{position:relative;flex-shrink:0;width:72px;height:72px}
.avatar-ring-outer{
  position:absolute;inset:-5px;border-radius:50%;
  border:1.5px solid transparent;
  background:conic-gradient(var(--red),#3a0008,var(--red)) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:destination-out;mask-composite:exclude;
  animation:rotRing 5s linear infinite;
}
@keyframes rotRing{to{transform:rotate(360deg)}}
.avatar-ring-inner{position:absolute;inset:-1px;border-radius:50%;background:var(--bg1);z-index:1}
.avatar-img{position:relative;z-index:2;width:72px;height:72px;border-radius:50%;object-fit:cover;display:block}

.profile-info{flex:1;min-width:0}
.profile-name{
  font-size:1.18rem;font-weight:700;letter-spacing:-0.025em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--platinum);
}
.profile-handle{font-family:var(--mono);font-size:0.72rem;color:var(--red);margin-top:3px;opacity:0.85}
.profile-bio{
  margin-top:7px;font-size:0.81rem;color:var(--silver);line-height:1.55;
  font-family:var(--mono);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.profile-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.profile-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0.8rem 1.5rem 0}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border:1px solid var(--border);border-radius:99px;
  font-size:0.67rem;font-family:var(--mono);color:var(--muted);background:var(--bg3);
  transition:border-color var(--t),color var(--t);
}
.tag:hover{border-color:var(--border2);color:var(--silver)}

.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  margin-top:1.1rem;background:var(--border);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.stat-box{
  background:var(--bg2);padding:14px 10px;text-align:center;
  transition:background var(--t);position:relative;overflow:hidden;
}
.stat-box::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,var(--red-dim) 0%,transparent 100%);
  opacity:0;transition:opacity var(--t);
}
.stat-box:hover{background:var(--bg3)}
.stat-box:hover::after{opacity:1}
.stat-value{font-family:var(--mono);font-size:1.12rem;font-weight:700;color:var(--red);position:relative;z-index:1}
.stat-label{font-size:0.59rem;color:var(--faint);text-transform:uppercase;letter-spacing:0.09em;margin-top:3px;font-family:var(--mono);position:relative;z-index:1}

/* ═══ SIGNATURE ═══ */
.signature-bar{
  display:flex;align-items:center;justify-content:flex-end;
  padding:10px 18px 12px;
  border-top:1px solid var(--border);
  gap:10px;
}
.sig-line-left{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,25,44,0.25))}
.sig-text{
  font-family:var(--sig);
  font-size:1.15rem;
  color:rgba(232,25,44,0.7);
  letter-spacing:0.04em;
  white-space:nowrap;
  user-select:none;
}

/* ═══ REPOS ═══ */
.repos-section{padding:1.1rem 1.5rem 1.4rem}
.repos-heading{
  font-family:var(--mono);font-size:0.6rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;
  display:flex;align-items:center;gap:7px;
}
.repos-heading::before{
  content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--red);box-shadow:0 0 6px var(--red);
}
.repos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px}
.repo-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 14px;
  text-decoration:none;display:block;
  transition:border-color var(--t),transform var(--t),background var(--t),box-shadow var(--t);
}
.repo-card:hover{
  border-color:var(--border3);background:var(--bg3);
  transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,25,44,0.07);
}
.repo-card:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.repo-name{font-family:var(--mono);font-size:0.74rem;font-weight:700;color:var(--red);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-desc{font-size:0.71rem;color:var(--silver);line-height:1.42;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.repo-meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:0.62rem;color:var(--faint)}
.lang-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ═══ PANEL ═══ */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:300;justify-content:flex-end}
.panel-overlay.open{display:flex}
.fav-panel{
  background:var(--bg1);border-left:1px solid var(--border2);
  width:320px;max-width:95vw;height:100vh;overflow-y:auto;
  padding:1.4rem;animation:slideIn 0.18s ease;display:flex;flex-direction:column;
}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.panel-title{font-size:0.78rem;font-weight:700;font-family:var(--mono);color:var(--red);display:flex;align-items:center;gap:7px;letter-spacing:0.07em}
.close-panel{width:26px;height:26px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--muted);cursor:pointer;font-size:0.78rem;display:flex;align-items:center;justify-content:center;transition:all var(--t);font-family:var(--mono)}
.close-panel:hover{border-color:var(--danger);color:var(--danger)}
.fav-list{flex:1;display:flex;flex-direction:column;gap:5px}
.fav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:border-color var(--t),background var(--t)}
.fav-item:hover{border-color:var(--border3);background:var(--bg3)}
.fav-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border2)}
.fav-info{flex:1;min-width:0}
.fav-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-login{font-family:var(--mono);font-size:0.64rem;color:var(--faint)}
.fav-del{width:22px;height:22px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--faint);cursor:pointer;font-family:var(--mono);font-size:0.68rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--t)}
.fav-del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-dim)}
.empty-fav{text-align:center;padding:3rem 1rem;color:var(--faint);font-family:var(--mono);font-size:0.74rem;line-height:1.8}
.empty-ico{font-size:1.6rem;display:block;margin-bottom:8px;opacity:0.3}
.panel-footer{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}

/* ═══ TOAST ═══ */
#toast{
  position:fixed;bottom:1.5rem;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--bg3);border:1px solid var(--border3);
  border-radius:var(--r-sm);padding:8px 18px;
  font-family:var(--mono);font-size:0.72rem;color:var(--platinum);
  z-index:500;transition:transform 0.22s ease;white-space:nowrap;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.t-success{border-color:rgba(0,229,160,0.35);color:var(--success)}
#toast.t-info   {border-color:rgba(232,25,44,0.3);color:var(--red)}
#toast.t-warn   {border-color:rgba(255,170,0,0.35);color:var(--warn)}

/* ═══ SKELETON ═══ */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.sk{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:600px 100%;animation:shimmer 1.1s infinite;border-radius:4px}

/* ═══ LANG COLORS ═══ */
.lc-js{background:#f1e05a}.lc-ts{background:#3178c6}.lc-python{background:#3572a5}
.lc-rust{background:#dea584}.lc-go{background:#00add8}.lc-c{background:#555}
.lc-cpp{background:#f34b7d}.lc-java{background:#b07219}.lc-ruby{background:#701516}
.lc-php{background:#4f5d95}.lc-swift{background:#f05138}.lc-kotlin{background:#7f52ff}
.lc-html{background:#e34c26}.lc-css{background:#563d7c}.lc-shell{background:#89e051}
.lc-vue{background:#41b883}.lc-dart{background:#00b4ab}.lc-default{background:#48485e}

.card-divider{height:1px;background:var(--border)}

.sec-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:0.59rem;color:var(--success);
  padding:3px 8px;border:1px solid rgba(0,229,160,0.18);
  border-radius:99px;background:rgba(0,229,160,0.05);letter-spacing:0.05em;
}

/* ═══ FOOTER GLOBAL ═══ */
.app-footer{
  position:relative;z-index:1;
  text-align:center;padding:1.2rem 1rem 2rem;
  border-top:1px solid var(--border);
}
.app-footer-sig{
  font-family:var(--sig);font-size:1.4rem;
  color:rgba(232,25,44,0.5);letter-spacing:0.05em;
  user-select:none;
}
.app-footer-role{
  font-family:var(--mono);font-size:0.58rem;
  color:var(--faint);letter-spacing:0.12em;text-transform:uppercase;
  margin-top:4px;
}

@media(max-width:600px){
  header{padding:0 1rem}
  .rate-chip{display:none}
  main{padding:1.2rem 1rem 4rem}
  .profile-top{flex-direction:column;align-items:center;text-align:center}
  .profile-actions{justify-content:center}
  .profile-tags{justify-content:center}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .repos-grid{grid-template-columns:1fr}
  .features{grid-template-columns:1fr}
}
@media(min-width:601px){main{padding:2rem 1.5rem 5rem}}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<div class="panel-overlay" id="panelOverlay" role="dialog" aria-modal="true" aria-label="Favoris">
  <div class="fav-panel">
    <div class="panel-head">
      <div class="panel-title">// FAVORIS <span class="badge" id="panelBadge">0</span></div>
      <button class="close-panel" id="btnClosePanel" aria-label="Fermer">✕</button>
    </div>
    <div class="fav-list" id="favList"></div>
    <div class="panel-footer" id="panelFooter" style="display:none">
      <button class="btn btn-danger-soft btn-sm" style="width:100%;justify-content:center" id="btnClearFavs">⊘ Vider les favoris</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<header>
  <div class="logo">
    <div class="logo-mark"><span class="logo-mark-inner">GH</span></div>
    <span class="logo-name">GIT</span><span class="logo-dim">HUNT</span>
  </div>
  <div class="header-right">
    <div class="sec-badge">◈ SECURE</div>
    <div class="rate-chip" id="rateChip">
      <span class="rate-dot" id="rateDot"></span>
      <span id="rateText">API</span>
    </div>
    <button class="btn btn-outline" id="btnFavs" aria-label="Favoris">
      // FAVORIS <span class="badge" id="headerBadge" style="display:none">0</span>
    </button>
  </div>
</header>

<main>
  <div class="search-bar">
    <div class="search-wrap" id="searchWrap">
      <span class="search-prefix">@</span>
      <input type="text" id="search-input"
        placeholder="pseudo GitHub..."
        autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false" maxlength="39"
        aria-label="Rechercher un utilisateur GitHub"/>
      <div class="hist-drop" id="histDrop"></div>
    </div>
    <button class="btn btn-red" id="btnSearch">SCAN</button>
  </div>

  <div id="view-welcome" class="view active">
    <div class="welcome-emblem">
      <div class="emblem-ring"></div>
      <div class="emblem-ring2"></div>
      <div class="emblem-core">GH</div>
    </div>
    <h1>Explorer les profils<br><span class="hl">GitHub</span></h1>
    <p>Recherchez un développeur, analysez ses statistiques et sauvegardez vos talents favoris.</p>
    <div class="features">
      <div class="feat-box"><div class="feat-icon">[01]</div><div class="feat-label">Profil complet</div></div>
      <div class="feat-box"><div class="feat-icon">[02]</div><div class="feat-label">Top Repos</div></div>
      <div class="feat-box"><div class="feat-icon">[03]</div><div class="feat-label">Favoris</div></div>
    </div>
  </div>

  <div id="view-loading" class="view">
    <div class="loader-ring" aria-hidden="true"></div>
    <span class="loader-text">SCANNING...</span>
  </div>

  <div id="view-error" class="view">
    <div class="error-box" role="alert">
      <div class="error-icon">✕</div>
      <span class="error-msg" id="error-msg">Utilisateur introuvable.</span>
    </div>
  </div>

  <div id="view-results" class="view">
    <div id="profile-card"></div>
  </div>
</main>

<footer class="app-footer">
  <div class="app-footer-sig">Taoufik Belamri</div>
  <div class="app-footer-role">IS Analysis · Web Development</div>
</footer>

<script>
(function(){
'use strict';

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;')}
function safeUrl(u){if(!u)return null;try{const x=new URL(String(u));if(!['https:','http:'].includes(x.protocol))return null;return x.href}catch{return null}}
function safeLogin(r){return String(r||'').replace(/[^a-zA-Z0-9\-]/g,'').slice(0,39)}
function fmtNum(n){const x=parseInt(n,10);if(isNaN(x))return'0';if(x>=1e6)return(x/1e6).toFixed(1)+'M';if(x>=1e3)return(x/1e3).toFixed(1)+'k';return x.toString()}
function langClass(l){const m={'JavaScript':'lc-js','TypeScript':'lc-ts','Python':'lc-python','Rust':'lc-rust','Go':'lc-go','C':'lc-c','C++':'lc-cpp','Java':'lc-java','Ruby':'lc-ruby','PHP':'lc-php','Swift':'lc-swift','Kotlin':'lc-kotlin','HTML':'lc-html','CSS':'lc-css','Shell':'lc-shell','Vue':'lc-vue','Dart':'lc-dart'};return m[l]||'lc-default'}

let favorites=[],history=[],currentUser=null,rateLimit={remaining:60,limit:60},abortCtrl=null,toastTimer=null;
try{favorites=JSON.parse(localStorage.getItem('githunt_favorites')||'[]')}catch{}
try{history=JSON.parse(localStorage.getItem('githunt_history')||'[]')}catch{}

const $=id=>document.getElementById(id);
const views={welcome:$('view-welcome'),loading:$('view-loading'),error:$('view-error'),results:$('view-results')};
const searchInput=$('search-input'),btnSearch=$('btnSearch'),profileCard=$('profile-card');
const headerBadge=$('headerBadge'),panelBadge=$('panelBadge');
const panelOverlay=$('panelOverlay'),favList=$('favList'),panelFooter=$('panelFooter');
const histDrop=$('histDrop'),errorMsg=$('error-msg'),rateDot=$('rateDot'),rateText=$('rateText');
const btnFavs=$('btnFavs'),btnClosePanel=$('btnClosePanel'),btnClearFavs=$('btnClearFavs');

function showView(n){Object.values(views).forEach(v=>v.classList.remove('active'));views[n]&&views[n].classList.add('active')}
function saveFavs(){try{localStorage.setItem('githunt_favorites',JSON.stringify(favorites))}catch{}}
function saveHist(){try{localStorage.setItem('githunt_history',JSON.stringify(history))}catch{}}
function updateBadge(){const n=favorites.length;headerBadge.textContent=n;panelBadge.textContent=n;headerBadge.style.display=n>0?'inline':'none'}
function isFav(l){return favorites.some(f=>f.login===l)}
function updateRateUI(){const{remaining,limit}=rateLimit;const pct=remaining/Math.max(limit,1);rateText.textContent=remaining+'/'+limit;rateDot.className='rate-dot'+(pct<0.1?' danger':pct<0.3?' warn':'')}
async function fetchRateLimit(){try{const r=await fetch('https://api.github.com/rate_limit',{headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)return;const d=await r.json();rateLimit=d.rate;updateRateUI()}catch{}}
function parseRateHeaders(r){const rem=r.headers.get('X-RateLimit-Remaining'),lim=r.headers.get('X-RateLimit-Limit');if(rem&&lim){rateLimit={remaining:parseInt(rem,10),limit:parseInt(lim,10)};updateRateUI()}}
function toast(msg,type='info'){const el=$('toast');el.textContent=msg;el.className='show t-'+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='t-'+type},2600)}
function addToHist(l){history=[l,...history.filter(h=>h!==l)].slice(0,8);saveHist()}
function showHistDrop(){if(!history.length)return;let html='<div class="hist-label">Historique</div>';history.slice(0,5).forEach(h=>{html+=`<div class="hist-item" data-l="${esc(h)}">@${esc(h)}<span>↵</span></div>`});histDrop.innerHTML=html;histDrop.classList.add('open');histDrop.querySelectorAll('.hist-item').forEach(el=>{el.addEventListener('click',()=>{searchInput.value=el.getAttribute('data-l');closeHistDrop();doSearch()})})}
function closeHistDrop(){histDrop.classList.remove('open')}
function skelHTML(){return`<div class="profile-card"><div class="card-header"><div class="profile-top"><div class="sk" style="width:72px;height:72px;border-radius:50%;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px"><div class="sk" style="height:18px;width:50%"></div><div class="sk" style="height:11px;width:30%"></div><div class="sk" style="height:10px;width:75%"></div></div></div></div><div class="stats-grid">${Array(4).fill('<div class="sk" style="height:58px"></div>').join('')}</div></div>`}

function renderProfile(user,repos){
  const favd=isFav(user.login);
  const ghUrl=safeUrl('https://github.com/'+encodeURIComponent(user.login));
  const tags=[];
  if(user.location)tags.push(`<span class="tag">📍 ${esc(user.location)}</span>`);
  if(user.company)tags.push(`<span class="tag">🏢 ${esc(user.company)}</span>`);
  if(user.blog){const b=safeUrl(user.blog.startsWith('http')?user.blog:'https://'+user.blog);if(b)tags.push(`<a class="tag" href="${b}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">🔗 Site</a>`)}
  if(user.created_at)tags.push(`<span class="tag">📅 ${new Date(user.created_at).getFullYear()}</span>`);
  if(user.twitter_username)tags.push(`<span class="tag">𝕏 @${esc(user.twitter_username)}</span>`);
  const reposHTML=repos&&repos.length?`<div class="card-divider"></div><div class="repos-section"><div class="repos-heading">Top Repositories</div><div class="repos-grid">${repos.map(repoCardHTML).join('')}</div></div>`:''
  profileCard.innerHTML=`<div class="profile-card"><div class="card-header"><div class="profile-top"><div class="avatar-wrap"><div class="avatar-ring-outer" aria-hidden="true"></div><div class="avatar-ring-inner"></div><img class="avatar-img" src="${esc(safeUrl(user.avatar_url)||'')}" alt="${esc(user.login)}" width="72" height="72" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22><rect width=%2272%22 height=%2272%22 fill=%22%2308080d%22/></svg>'"/></div><div class="profile-info"><div class="profile-name">${esc(user.name||user.login)}</div><div class="profile-handle">@${esc(user.login)}</div>${user.bio?`<div class="profile-bio">${esc(user.bio)}</div>`:''}<div class="profile-actions"><button class="btn btn-fav${favd?' is-fav':''}" id="btn-fav-toggle">${favd?'★ Favori':'☆ Ajouter'}</button>${ghUrl?`<a class="btn btn-outline" href="${ghUrl}" target="_blank" rel="noopener noreferrer">↗ GitHub</a>`:''} ${user.email?`<a class="btn btn-outline" href="mailto:${esc(user.email)}">✉ Email</a>`:''}</div></div></div></div>${tags.length?`<div class="profile-tags">${tags.join('')}</div>`:''}<div class="stats-grid"><div class="stat-box"><div class="stat-value">${fmtNum(user.followers)}</div><div class="stat-label">Followers</div></div><div class="stat-box"><div class="stat-value">${fmtNum(user.following)}</div><div class="stat-label">Following</div></div><div class="stat-box"><div class="stat-value">${fmtNum(user.public_repos)}</div><div class="stat-label">Repos</div></div><div class="stat-box"><div class="stat-value">${fmtNum(user.public_gists)}</div><div class="stat-label">Gists</div></div></div>${reposHTML}<div class="signature-bar"><div class="sig-line-left"></div><span class="sig-text">Taoufik Belamri</span></div></div>`;
  document.getElementById('btn-fav-toggle').addEventListener('click',()=>toggleFav(user));
  currentUser=user;showView('results');
}

function repoCardHTML(r){const url=safeUrl(r.html_url);if(!url)return'';const lang=r.language||'';return`<a class="repo-card" href="${url}" target="_blank" rel="noopener noreferrer"><div class="repo-name">${esc(r.name)}</div>${r.description?`<div class="repo-desc">${esc(r.description)}</div>`:''}<div class="repo-meta">${lang?`<span class="lang-dot ${langClass(lang)}"></span><span>${esc(lang)}</span>`:''} ${r.stargazers_count>0?`<span>★ ${fmtNum(r.stargazers_count)}</span>`:''} ${r.forks_count>0?`<span>⑂ ${fmtNum(r.forks_count)}</span>`:''}</div></a>`}

function toggleFav(user){if(isFav(user.login)){favorites=favorites.filter(f=>f.login!==user.login);toast('@'+user.login+' retiré','info')}else{favorites.push({login:user.login,name:user.name||user.login,avatar:safeUrl(user.avatar_url)||''});toast('@'+user.login+' ajouté ★','success')}saveFavs();updateBadge();const btn=document.getElementById('btn-fav-toggle');if(btn){const f=isFav(user.login);btn.className='btn btn-fav'+(f?' is-fav':'');btn.textContent=f?'★ Favori':'☆ Ajouter'}if(panelOverlay.classList.contains('open'))renderFavPanel()}

function renderFavPanel(){updateBadge();if(!favorites.length){favList.innerHTML=`<div class="empty-fav"><span class="empty-ico">☆</span>Aucun favori.<br>Recherchez et ajoutez des profils.</div>`;panelFooter.style.display='none';return}favList.innerHTML=favorites.map((f,i)=>`<div class="fav-item" data-i="${i}"><img class="fav-avatar" src="${esc(f.avatar)}" alt="${esc(f.login)}" width="34" height="34" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2234%22 height=%2234%22><rect width=%2234%22 height=%2234%22 fill=%22%2308080d%22/></svg>'"/><div class="fav-info"><div class="fav-name">${esc(f.name)}</div><div class="fav-login">@${esc(f.login)}</div></div><button class="fav-del" data-login="${esc(f.login)}" aria-label="Retirer ${esc(f.login)}">✕</button></div>`).join('');panelFooter.style.display='block';favList.querySelectorAll('.fav-item').forEach(el=>{el.addEventListener('click',e=>{if(e.target.classList.contains('fav-del'))return;const l=favorites[parseInt(el.getAttribute('data-i'),10)]?.login;if(l){closePanel();searchInput.value=l;doSearch()}})});favList.querySelectorAll('.fav-del').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();const l=btn.getAttribute('data-login');favorites=favorites.filter(f=>f.login!==l);saveFavs();renderFavPanel();if(currentUser&&currentUser.login===l){const b=document.getElementById('btn-fav-toggle');if(b){b.className='btn btn-fav';b.textContent='☆ Ajouter'}}toast('@'+l+' retiré','info')})})}

function openPanel(){renderFavPanel();panelOverlay.classList.add('open');btnFavs.classList.add('active')}
function closePanel(){panelOverlay.classList.remove('open');btnFavs.classList.remove('active')}
panelOverlay.addEventListener('click',e=>{if(e.target===panelOverlay)closePanel()});
btnClosePanel.addEventListener('click',closePanel);
btnFavs.addEventListener('click',()=>panelOverlay.classList.contains('open')?closePanel():openPanel());
btnClearFavs.addEventListener('click',()=>{if(!confirm('Vider tous les favoris ?'))return;favorites=[];saveFavs();renderFavPanel();updateBadge();if(currentUser){const b=document.getElementById('btn-fav-toggle');if(b){b.className='btn btn-fav';b.textContent='☆ Ajouter'}}toast('Favoris vidés','warn')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

const HDRS={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
async function fetchUser(login){const r=await fetch(`https://api.github.com/users/${encodeURIComponent(login)}`,{headers:HDRS,signal:abortCtrl.signal});parseRateHeaders(r);if(r.status===404)throw Object.assign(new Error('Utilisateur introuvable sur GitHub.'),{status:404});if(r.status===403)throw Object.assign(new Error('Limite API GitHub atteinte.'),{status:403});if(!r.ok)throw new Error('Erreur serveur ('+r.status+').');return r.json()}
async function fetchRepos(login){try{const r=await fetch(`https://api.github.com/users/${encodeURIComponent(login)}/repos?sort=stars&direction=desc&per_page=6`,{headers:HDRS,signal:abortCtrl.signal});if(!r.ok)return[];return r.json()}catch{return[]}}

async function doSearch(){
  const raw=searchInput.value.trim();const login=safeLogin(raw);
  if(!login){errorMsg.textContent='Entrez un pseudo GitHub valide.';showView('error');return}
  if(abortCtrl)abortCtrl.abort();abortCtrl=new AbortController();
  closeHistDrop();addToHist(login);
  btnSearch.disabled=true;btnSearch.textContent='...';
  profileCard.innerHTML=skelHTML();showView('results');
  await new Promise(r=>setTimeout(r,80));
  try{
    const[user,repos]=await Promise.all([fetchUser(login),fetchRepos(login)]);
    renderProfile(user,repos);
  }catch(err){
    if(err.name==='AbortError')return;
    let msg=err.message||'Erreur inconnue.';
    if(err instanceof TypeError)msg='Connexion impossible. Vérifiez votre réseau.';
    errorMsg.textContent=msg;showView('error');
  }finally{btnSearch.disabled=false;btnSearch.textContent='SCAN'}
}

btnSearch.addEventListener('click',doSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){closeHistDrop();doSearch()}if(e.key==='Escape')closeHistDrop()});
searchInput.addEventListener('input',()=>{const c=searchInput.value.replace(/[^a-zA-Z0-9\-]/g,'');if(searchInput.value!==c)searchInput.value=c;closeHistDrop()});
searchInput.addEventListener('focus',()=>{if(!searchInput.value&&history.length)showHistDrop()});
document.addEventListener('click',e=>{if(!$('searchWrap').contains(e.target))closeHistDrop()});

updateBadge();updateRateUI();fetchRateLimit();showView('welcome');
})();
</script>
</body>
</html>
