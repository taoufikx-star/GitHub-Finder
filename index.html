<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src https: data:; script-src 'self' 'unsafe-inline';">
<meta name="referrer" content="no-referrer">
<title>GitHunt — Gold Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0a0c;
  --bg1: #0f0f12;
  --bg2: #141418;
  --bg3: #1a1a20;
  --bg4: #202028;
  --border: rgba(212,175,55,0.12);
  --border2: rgba(212,175,55,0.25);
  --border3: rgba(212,175,55,0.45);
  --gold: #d4af37;
  --gold-light: #f0d060;
  --gold-dim: rgba(212,175,55,0.08);
  --gold-dim2: rgba(212,175,55,0.15);
  --gold-glow: rgba(212,175,55,0.22);
  --platinum: #e8e8f0;
  --silver: #a8a8c0;
  --muted: #66667a;
  --faint: #3a3a4a;
  --success: #3de89e;
  --danger: #ff6b6b;
  --danger-dim: rgba(255,107,107,0.08);
  --warn: #ffaa00;
  --info: #60aaff;
  --sans: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --r: 10px;
  --r-sm: 6px;
  --t: 0.16s ease;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}

body {
  background: var(--bg);
  color: var(--platinum);
  font-family: var(--sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── Scanline texture ── */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(212,175,55,0.012) 2px,
    rgba(212,175,55,0.012) 4px
  );
  pointer-events:none;
  z-index:0;
}

/* ── Corner ambient glow ── */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212,175,55,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 100% 100%, rgba(212,175,55,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 35% 25% at 0% 100%, rgba(60,60,180,0.03) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* ═══════ HEADER ═══════ */
header {
  position:sticky;
  top:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 2rem;
  height:58px;
  border-bottom:1px solid var(--border);
  background:rgba(10,10,12,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.logo {
  font-family:var(--mono);
  font-size:0.95rem;
  font-weight:700;
  letter-spacing:0.06em;
  display:flex;
  align-items:center;
  gap:8px;
  user-select:none;
}
.logo-icon {
  width:26px;height:26px;
  border:1.5px solid var(--gold);
  border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;
  color:var(--gold);
  font-weight:700;
}
.logo-text{color:var(--gold)}
.logo-dim{color:var(--muted)}

.header-right{display:flex;align-items:center;gap:8px}

/* Rate */
.rate-chip {
  display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:0.65rem;
  color:var(--muted);
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:99px;
  background:var(--bg2);
  transition:border-color var(--t);
}
.rate-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--success);
  transition:background var(--t);
}
.rate-dot.warn{background:var(--warn)}
.rate-dot.danger{background:var(--danger)}

/* ═══════ BUTTONS ═══════ */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;
  border-radius:var(--r-sm);
  border:none;cursor:pointer;
  font-family:var(--mono);font-size:0.72rem;font-weight:700;
  letter-spacing:0.05em;
  transition:all var(--t);
  white-space:nowrap;text-decoration:none;
}
.btn:active{transform:scale(0.96)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.btn-gold {
  background:linear-gradient(135deg,#c4960a 0%,#e8c540 45%,#c4960a 100%);
  color:#0a0a08;
  font-weight:700;
  box-shadow:0 0 0 1px rgba(212,175,55,0.3);
}
.btn-gold:hover{
  background:linear-gradient(135deg,#d4a81a 0%,#f0d460 45%,#d4a81a 100%);
  box-shadow:0 4px 24px rgba(212,175,55,0.25),0 0 0 1px rgba(212,175,55,0.5);
}
.btn-gold:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none}

.btn-outline {
  background:transparent;
  color:var(--silver);
  border:1px solid var(--border2);
}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.btn-outline.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

.btn-fav{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);padding:6px 12px;
}
.btn-fav:hover{border-color:var(--warn);color:var(--warn);background:rgba(255,170,0,0.07)}
.btn-fav.is-fav{color:var(--warn);border-color:rgba(255,170,0,0.4);background:rgba(255,170,0,0.07)}

.btn-sm{padding:5px 10px;font-size:0.65rem}
.btn-danger-soft{
  background:transparent;color:var(--danger);
  border:1px solid rgba(255,107,107,0.2);
}
.btn-danger-soft:hover{background:var(--danger-dim);border-color:var(--danger)}

/* Badge */
.badge {
  background:var(--gold);color:#0a0a08;
  font-family:var(--mono);font-size:0.6rem;font-weight:700;
  padding:2px 6px;border-radius:99px;
  min-width:16px;text-align:center;
}

/* ═══════ MAIN ═══════ */
main {
  position:relative;z-index:1;
  flex:1;display:flex;flex-direction:column;
  max-width:800px;width:100%;
  margin:0 auto;
  padding:2rem 1.5rem 5rem;
  gap:1rem;
}

/* ═══════ SEARCH ═══════ */
.search-bar{display:flex;gap:8px;width:100%}

.search-wrap{position:relative;flex:1;min-width:0}

.search-prefix{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:0.85rem;color:var(--gold);
  pointer-events:none;z-index:1;
  font-weight:700;
}

#search-input{
  width:100%;
  padding:10px 14px 10px 34px;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  color:var(--platinum);
  font-family:var(--mono);font-size:0.84rem;
  outline:none;
  transition:border-color var(--t),box-shadow var(--t),background var(--t);
}
#search-input::placeholder{color:var(--faint)}
#search-input:focus{
  border-color:var(--gold);
  background:var(--bg3);
  box-shadow:0 0 0 3px rgba(212,175,55,0.1),inset 0 1px 0 rgba(212,175,55,0.05);
}

/* History dropdown */
.hist-drop{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r-sm);z-index:50;overflow:hidden;display:none;
}
.hist-drop.open{display:block}
.hist-label{
  padding:5px 11px;font-size:0.6rem;color:var(--faint);
  text-transform:uppercase;letter-spacing:0.1em;
  font-family:var(--mono);background:var(--bg3);
  border-bottom:1px solid var(--border);
}
.hist-item{
  padding:8px 11px;font-family:var(--mono);font-size:0.76rem;
  color:var(--silver);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);
  transition:background var(--t),color var(--t);
}
.hist-item:last-child{border-bottom:none}
.hist-item:hover{background:var(--bg4);color:var(--gold)}
.hist-item span{font-size:0.6rem;opacity:0.35}

/* ═══════ VIEWS ═══════ */
.view{display:none}
.view.active{display:block;animation:fadeUp 0.24s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── WELCOME ── */
#view-welcome{text-align:center;padding:5rem 1rem 3rem}

.welcome-hexagon{
  width:64px;height:64px;
  margin:0 auto 2rem;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.welcome-hexagon::before{
  content:'';position:absolute;inset:0;
  background:var(--gold-dim);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  border:1px solid var(--border3);
  animation:hexPulse 3s ease-in-out infinite;
}
@keyframes hexPulse{
  0%,100%{opacity:0.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}
.welcome-hexagon-inner{
  font-family:var(--mono);font-size:1.3rem;font-weight:700;
  color:var(--gold);z-index:1;
}

#view-welcome h1{
  font-size:clamp(1.7rem,4.5vw,2.6rem);
  font-weight:700;
  letter-spacing:-0.03em;
  line-height:1.2;
  margin-bottom:0.9rem;
  color:var(--platinum);
}
#view-welcome h1 .hl{
  background:linear-gradient(90deg,#c4960a,#f0d060,#c4960a);
  background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:goldShimmer 3s linear infinite;
}
@keyframes goldShimmer{0%{background-position:0%}100%{background-position:200%}}

#view-welcome p{
  color:var(--muted);font-family:var(--mono);font-size:0.82rem;
  line-height:1.7;max-width:380px;margin:0 auto;
}

/* ── FEATURES ── */
.features{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin-top:2rem;
}
.feat-box{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;text-align:center;
  transition:border-color var(--t);
}
.feat-box:hover{border-color:var(--border2)}
.feat-icon{font-size:1.1rem;margin-bottom:6px}
.feat-label{font-family:var(--mono);font-size:0.66rem;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase}

/* ── LOADING ── */
#view-loading{
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:4rem 1rem;gap:1.25rem;
}
#view-loading.active{display:flex}

.loader-ring{
  width:42px;height:42px;
  border:2px solid var(--border);
  border-top-color:var(--gold);
  border-right-color:rgba(212,175,55,0.4);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loader-text{
  font-family:var(--mono);font-size:0.7rem;
  color:var(--muted);letter-spacing:0.12em;
  text-transform:uppercase;
}

/* ── ERROR ── */
#view-error{display:none;align-items:center;justify-content:center;padding:3rem 1rem}
#view-error.active{display:flex}
.error-box{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid rgba(255,107,107,0.2);
  border-radius:var(--r);padding:2rem 2.5rem;text-align:center;max-width:380px;
}
.error-icon{
  width:40px;height:40px;border-radius:50%;
  background:var(--danger-dim);border:1px solid rgba(255,107,107,0.25);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:1rem;color:var(--danger);
}
.error-msg{font-family:var(--mono);color:var(--danger);font-size:0.82rem;line-height:1.55}

/* ═══════ PROFILE CARD ═══════ */
.profile-card{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-radius:var(--r);
  overflow:hidden;
  position:relative;
}

/* Top accent line */
.profile-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.6;
}

/* Corner ornaments */
.profile-card::after{
  content:'';position:absolute;bottom:0;right:0;
  width:80px;height:80px;
  background:radial-gradient(circle at 100% 100%,rgba(212,175,55,0.05) 0%,transparent 70%);
  pointer-events:none;
}

.card-header{
  padding:1.4rem 1.5rem 0;
  background:linear-gradient(180deg,var(--bg2) 0%,transparent 100%);
}

.profile-top{
  display:flex;align-items:flex-start;gap:1.2rem;
  margin-bottom:1.1rem;
}

/* Avatar */
.avatar-wrap{position:relative;flex-shrink:0;width:72px;height:72px}
.avatar-ring-outer{
  position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(var(--gold) 0deg,rgba(212,175,55,0.1) 180deg,var(--gold) 360deg);
  animation:rotRing 5s linear infinite;
  opacity:0.7;
}
@keyframes rotRing{to{transform:rotate(360deg)}}
.avatar-ring-inner{
  position:absolute;inset:-1px;border-radius:50%;
  background:var(--bg1);z-index:1;
}
.avatar-img{
  position:relative;z-index:2;
  width:72px;height:72px;border-radius:50%;
  object-fit:cover;display:block;
}

/* Profile info */
.profile-info{flex:1;min-width:0}
.profile-name{
  font-size:1.2rem;font-weight:700;
  letter-spacing:-0.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--platinum);
}
.profile-handle{
  font-family:var(--mono);font-size:0.74rem;
  color:var(--gold);margin-top:3px;
}
.profile-bio{
  margin-top:7px;font-size:0.82rem;color:var(--silver);
  line-height:1.5;font-family:var(--mono);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.profile-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* Tags */
.profile-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0.85rem 1.5rem 0}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border:1px solid var(--border);
  border-radius:99px;font-size:0.68rem;
  font-family:var(--mono);color:var(--muted);background:var(--bg3);
  transition:border-color var(--t),color var(--t);
}
.tag:hover{border-color:var(--border2);color:var(--silver)}

/* Stats */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;margin-top:1.1rem;
  background:var(--border);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.stat-box{
  background:var(--bg2);padding:14px 10px;
  text-align:center;transition:background var(--t);
}
.stat-box:hover{background:var(--bg3)}
.stat-value{
  font-family:var(--mono);font-size:1.15rem;font-weight:700;
  color:var(--gold-light);
}
.stat-label{
  font-size:0.6rem;color:var(--faint);
  text-transform:uppercase;letter-spacing:0.08em;
  margin-top:3px;font-family:var(--mono);
}

/* ═══════ REPOS ═══════ */
.repos-section{padding:1.1rem 1.5rem 1.4rem}
.repos-heading{
  font-family:var(--mono);font-size:0.62rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.1em;
  margin-bottom:10px;
  display:flex;align-items:center;gap:7px;
}
.repos-heading::before{
  content:'';display:inline-block;width:6px;height:6px;
  border-radius:50%;background:var(--gold);opacity:0.7;
}

.repos-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:7px;
}

.repo-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 14px;
  text-decoration:none;display:block;
  transition:border-color var(--t),transform var(--t),background var(--t);
}
.repo-card:hover{
  border-color:var(--border3);
  background:var(--bg3);
  transform:translateY(-1px);
}
.repo-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.repo-name{
  font-family:var(--mono);font-size:0.76rem;font-weight:700;
  color:var(--gold);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.repo-desc{
  font-size:0.72rem;color:var(--silver);line-height:1.42;
  margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.repo-meta{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:0.64rem;color:var(--faint);
}
.lang-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ═══════ PANEL (FAVORIS) ═══════ */
.panel-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.72);z-index:300;justify-content:flex-end;
}
.panel-overlay.open{display:flex}

.fav-panel{
  background:var(--bg1);border-left:1px solid var(--border2);
  width:330px;max-width:95vw;height:100vh;overflow-y:auto;
  padding:1.4rem;animation:slideIn 0.2s ease;
  display:flex;flex-direction:column;
}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.2rem;padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.panel-title{
  font-size:0.85rem;font-weight:700;font-family:var(--mono);
  color:var(--gold);display:flex;align-items:center;gap:7px;letter-spacing:0.04em;
}
.close-panel{
  width:27px;height:27px;border:1px solid var(--border);border-radius:5px;
  background:transparent;color:var(--muted);cursor:pointer;
  font-size:0.8rem;display:flex;align-items:center;justify-content:center;
  transition:all var(--t);font-family:var(--mono);
}
.close-panel:hover{border-color:var(--danger);color:var(--danger)}

.fav-list{flex:1;display:flex;flex-direction:column;gap:5px}

.fav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);cursor:pointer;
  transition:border-color var(--t),background var(--t);
}
.fav-item:hover{border-color:var(--border3);background:var(--bg3)}

.fav-avatar{
  width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:1px solid var(--border2);
}
.fav-info{flex:1;min-width:0}
.fav-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-login{font-family:var(--mono);font-size:0.66rem;color:var(--faint)}

.fav-del{
  width:24px;height:24px;border:1px solid transparent;border-radius:4px;
  background:transparent;color:var(--faint);cursor:pointer;
  font-family:var(--mono);font-size:0.7rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all var(--t);
}
.fav-del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-dim)}

.empty-fav{
  text-align:center;padding:3rem 1rem;
  color:var(--faint);font-family:var(--mono);font-size:0.76rem;line-height:1.75;
}
.empty-ico{font-size:1.8rem;display:block;margin-bottom:8px;opacity:0.4}

.panel-footer{
  margin-top:1rem;padding-top:1rem;
  border-top:1px solid var(--border);
}

/* ═══════ TOAST ═══════ */
#toast{
  position:fixed;bottom:1.5rem;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--bg3);border:1px solid var(--border3);
  border-radius:var(--r-sm);
  padding:8px 16px;font-family:var(--mono);font-size:0.74rem;color:var(--platinum);
  z-index:500;transition:transform 0.24s ease;white-space:nowrap;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.t-success{border-color:rgba(61,232,158,0.4);color:var(--success)}
#toast.t-info   {border-color:rgba(212,175,55,0.35);color:var(--gold)}
#toast.t-warn   {border-color:rgba(255,170,0,0.4);color:var(--warn)}

/* ═══════ SKELETON ═══════ */
@keyframes shimmer{
  0%{background-position:-600px 0}
  100%{background-position:600px 0}
}
.sk{
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);
  background-size:600px 100%;
  animation:shimmer 1.2s infinite;
  border-radius:4px;
}

/* ═══════ LANG COLORS ═══════ */
.lc-js{background:#f1e05a}.lc-ts{background:#3178c6}.lc-python{background:#3572a5}
.lc-rust{background:#dea584}.lc-go{background:#00add8}.lc-c{background:#555}
.lc-cpp{background:#f34b7d}.lc-java{background:#b07219}.lc-ruby{background:#701516}
.lc-php{background:#4f5d95}.lc-swift{background:#f05138}.lc-kotlin{background:#7f52ff}
.lc-html{background:#e34c26}.lc-css{background:#563d7c}.lc-shell{background:#89e051}
.lc-vue{background:#41b883}.lc-dart{background:#00b4ab}.lc-default{background:#6a6a8a}

/* ═══════ DIVIDER ═══════ */
.card-divider{
  height:1px;background:var(--border);margin:0;
}

/* ═══════ SECURITY BADGE ═══════ */
.sec-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:0.6rem;
  color:var(--success);
  padding:3px 8px;
  border:1px solid rgba(61,232,158,0.2);
  border-radius:99px;background:rgba(61,232,158,0.06);
  letter-spacing:0.05em;
}

/* ═══════ RESPONSIVE ═══════ */
@media(max-width:600px){
  header{padding:0 1rem}
  .rate-chip{display:none}
  main{padding:1.2rem 1rem 4rem}
  .profile-top{flex-direction:column;align-items:center;text-align:center}
  .profile-actions{justify-content:center}
  .profile-tags{justify-content:center}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .repos-grid{grid-template-columns:1fr}
  .features{grid-template-columns:1fr}
}
@media(min-width:601px){main{padding:2rem 1.5rem 5rem}}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<!-- PANEL FAVORIS -->
<div class="panel-overlay" id="panelOverlay" role="dialog" aria-modal="true" aria-label="Favoris">
  <div class="fav-panel">
    <div class="panel-head">
      <div class="panel-title">◈ FAVORIS <span class="badge" id="panelBadge">0</span></div>
      <button class="close-panel" id="btnClosePanel" aria-label="Fermer">✕</button>
    </div>
    <div class="fav-list" id="favList"></div>
    <div class="panel-footer" id="panelFooter" style="display:none">
      <button class="btn btn-danger-soft btn-sm" style="width:100%;justify-content:center" id="btnClearFavs">
        ⊘ Vider les favoris
      </button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">GH</div>
    <span class="logo-text">Git</span><span class="logo-dim">Hunt</span>
  </div>
  <div class="header-right">
    <div class="sec-badge">◈ SECURE</div>
    <div class="rate-chip" id="rateChip">
      <span class="rate-dot" id="rateDot"></span>
      <span id="rateText">API</span>
    </div>
    <button class="btn btn-outline" id="btnFavs" aria-label="Favoris">
      ◈ Favoris <span class="badge" id="headerBadge" style="display:none">0</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- Search -->
  <div class="search-bar">
    <div class="search-wrap" id="searchWrap">
      <span class="search-prefix">@</span>
      <input type="text" id="search-input"
        placeholder="pseudo GitHub..."
        autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false" maxlength="39"
        aria-label="Rechercher un utilisateur GitHub"/>
      <div class="hist-drop" id="histDrop"></div>
    </div>
    <button class="btn btn-gold" id="btnSearch">CHERCHER</button>
  </div>

  <!-- Welcome -->
  <div id="view-welcome" class="view active">
    <div class="welcome-hexagon"><span class="welcome-hexagon-inner">GH</span></div>
    <h1>Explorez les profils<br><span class="hl">GitHub Elite</span></h1>
    <p>Recherchez un développeur, analysez ses statistiques et sauvegardez vos talents favoris.</p>
    <div class="features">
      <div class="feat-box">
        <div class="feat-icon">◈</div>
        <div class="feat-label">Profil complet</div>
      </div>
      <div class="feat-box">
        <div class="feat-icon">⬡</div>
        <div class="feat-label">Top Repos</div>
      </div>
      <div class="feat-box">
        <div class="feat-icon">★</div>
        <div class="feat-label">Favoris sauvés</div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="view-loading" class="view">
    <div class="loader-ring" aria-hidden="true"></div>
    <span class="loader-text">ANALYSE EN COURS...</span>
  </div>

  <!-- Error -->
  <div id="view-error" class="view">
    <div class="error-box" role="alert">
      <div class="error-icon">✕</div>
      <span class="error-msg" id="error-msg">Utilisateur introuvable.</span>
    </div>
  </div>

  <!-- Results -->
  <div id="view-results" class="view">
    <div id="profile-card"></div>
  </div>

</main>

<script>
(function(){
'use strict';

/* ── Security utils ── */
function esc(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}
function safeUrl(u){
  if(!u)return null;
  try{const x=new URL(String(u));if(!['https:','http:'].includes(x.protocol))return null;return x.href}catch{return null}
}
function safeLogin(r){return String(r||'').replace(/[^a-zA-Z0-9\-]/g,'').slice(0,39)}
function fmtNum(n){
  const x=parseInt(n,10);if(isNaN(x))return'0';
  if(x>=1e6)return(x/1e6).toFixed(1)+'M';
  if(x>=1e3)return(x/1e3).toFixed(1)+'k';
  return x.toString();
}
function langClass(l){
  const m={'JavaScript':'lc-js','TypeScript':'lc-ts','Python':'lc-python','Rust':'lc-rust','Go':'lc-go','C':'lc-c','C++':'lc-cpp','Java':'lc-java','Ruby':'lc-ruby','PHP':'lc-php','Swift':'lc-swift','Kotlin':'lc-kotlin','HTML':'lc-html','CSS':'lc-css','Shell':'lc-shell','Vue':'lc-vue','Dart':'lc-dart'};
  return m[l]||'lc-default';
}

/* ── State ── */
let favorites=[],history=[],currentUser=null,rateLimit={remaining:60,limit:60},abortCtrl=null,toastTimer=null;
try{favorites=JSON.parse(localStorage.getItem('githunt_favorites')||'[]')}catch{}
try{history=JSON.parse(localStorage.getItem('githunt_history')||'[]')}catch{}

/* ── DOM ── */
const $=id=>document.getElementById(id);
const views={welcome:$('view-welcome'),loading:$('view-loading'),error:$('view-error'),results:$('view-results')};
const searchInput=$('search-input'),btnSearch=$('btnSearch'),profileCard=$('profile-card');
const headerBadge=$('headerBadge'),panelBadge=$('panelBadge');
const panelOverlay=$('panelOverlay'),favList=$('favList'),panelFooter=$('panelFooter');
const histDrop=$('histDrop'),errorMsg=$('error-msg'),rateDot=$('rateDot'),rateText=$('rateText');
const btnFavs=$('btnFavs'),btnClosePanel=$('btnClosePanel'),btnClearFavs=$('btnClearFavs');

/* ── Views ── */
function showView(n){Object.values(views).forEach(v=>v.classList.remove('active'));views[n]&&views[n].classList.add('active')}

/* ── Storage ── */
function saveFavs(){try{localStorage.setItem('githunt_favorites',JSON.stringify(favorites))}catch{}}
function saveHist(){try{localStorage.setItem('githunt_history',JSON.stringify(history))}catch{}}
function updateBadge(){const n=favorites.length;headerBadge.textContent=n;panelBadge.textContent=n;headerBadge.style.display=n>0?'inline':'none'}
function isFav(l){return favorites.some(f=>f.login===l)}

/* ── Rate limit ── */
function updateRateUI(){
  const{remaining,limit}=rateLimit;const pct=remaining/Math.max(limit,1);
  rateText.textContent=remaining+'/'+limit;
  rateDot.className='rate-dot'+(pct<0.1?' danger':pct<0.3?' warn':'');
}
async function fetchRateLimit(){
  try{const r=await fetch('https://api.github.com/rate_limit',{headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)return;const d=await r.json();rateLimit=d.rate;updateRateUI()}catch{}
}
function parseRateHeaders(r){
  const rem=r.headers.get('X-RateLimit-Remaining'),lim=r.headers.get('X-RateLimit-Limit');
  if(rem&&lim){rateLimit={remaining:parseInt(rem,10),limit:parseInt(lim,10)};updateRateUI()}
}

/* ── Toast ── */
function toast(msg,type='info'){
  const el=$('toast');el.textContent=msg;el.className='show t-'+type;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='t-'+type},2600);
}

/* ── History ── */
function addToHist(l){history=[l,...history.filter(h=>h!==l)].slice(0,8);saveHist()}
function showHistDrop(){
  if(!history.length)return;
  let html='<div class="hist-label">Historique</div>';
  history.slice(0,5).forEach(h=>{
    html+=`<div class="hist-item" data-l="${esc(h)}">@${esc(h)}<span>↵</span></div>`;
  });
  histDrop.innerHTML=html;histDrop.classList.add('open');
  histDrop.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click',()=>{searchInput.value=el.getAttribute('data-l');closeHistDrop();doSearch()});
  });
}
function closeHistDrop(){histDrop.classList.remove('open')}

/* ── Skeleton ── */
function skelHTML(){
  return`<div class="profile-card">
    <div class="card-header">
      <div class="profile-top">
        <div class="sk" style="width:72px;height:72px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px">
          <div class="sk" style="height:18px;width:50%"></div>
          <div class="sk" style="height:11px;width:30%"></div>
          <div class="sk" style="height:10px;width:75%"></div>
        </div>
      </div>
    </div>
    <div class="stats-grid">${Array(4).fill('<div class="sk" style="height:58px"></div>').join('')}</div>
  </div>`;
}

/* ── Render profile ── */
function renderProfile(user,repos){
  const favd=isFav(user.login);
  const ghUrl=safeUrl('https://github.com/'+encodeURIComponent(user.login));
  const tags=[];
  if(user.location)tags.push(`<span class="tag">📍 ${esc(user.location)}</span>`);
  if(user.company)tags.push(`<span class="tag">🏢 ${esc(user.company)}</span>`);
  if(user.blog){const b=safeUrl(user.blog.startsWith('http')?user.blog:'https://'+user.blog);if(b)tags.push(`<a class="tag" href="${b}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">🔗 Site web</a>`)}
  if(user.created_at)tags.push(`<span class="tag">📅 ${new Date(user.created_at).getFullYear()}</span>`);
  if(user.twitter_username)tags.push(`<span class="tag">𝕏 @${esc(user.twitter_username)}</span>`);

  const reposHTML=repos&&repos.length?`
    <div class="card-divider"></div>
    <div class="repos-section">
      <div class="repos-heading">Top Repositories</div>
      <div class="repos-grid">${repos.map(repoCardHTML).join('')}</div>
    </div>`:''

  profileCard.innerHTML=`
    <div class="profile-card">
      <div class="card-header">
        <div class="profile-top">
          <div class="avatar-wrap">
            <div class="avatar-ring-outer" aria-hidden="true"></div>
            <div class="avatar-ring-inner"></div>
            <img class="avatar-img"
              src="${esc(safeUrl(user.avatar_url)||'')}"
              alt="${esc(user.login)}" width="72" height="72" loading="lazy"
              onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22><rect width=%2272%22 height=%2272%22 fill=%22%230f0f12%22/></svg>'"
            />
          </div>
          <div class="profile-info">
            <div class="profile-name">${esc(user.name||user.login)}</div>
            <div class="profile-handle">@${esc(user.login)}</div>
            ${user.bio?`<div class="profile-bio">${esc(user.bio)}</div>`:''}
            <div class="profile-actions">
              <button class="btn btn-fav${favd?' is-fav':''}" id="btn-fav-toggle">
                ${favd?'★ Favori':'☆ Ajouter'}
              </button>
              ${ghUrl?`<a class="btn btn-outline" href="${ghUrl}" target="_blank" rel="noopener noreferrer">↗ GitHub</a>`:''}
              ${user.email?`<a class="btn btn-outline" href="mailto:${esc(user.email)}">✉ Email</a>`:''}
            </div>
          </div>
        </div>
      </div>
      ${tags.length?`<div class="profile-tags">${tags.join('')}</div>`:''}
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-value">${fmtNum(user.followers)}</div><div class="stat-label">Followers</div></div>
        <div class="stat-box"><div class="stat-value">${fmtNum(user.following)}</div><div class="stat-label">Following</div></div>
        <div class="stat-box"><div class="stat-value">${fmtNum(user.public_repos)}</div><div class="stat-label">Repos</div></div>
        <div class="stat-box"><div class="stat-value">${fmtNum(user.public_gists)}</div><div class="stat-label">Gists</div></div>
      </div>
      ${reposHTML}
    </div>`;

  document.getElementById('btn-fav-toggle').addEventListener('click',()=>toggleFav(user));
  currentUser=user;showView('results');
}

/* ── Repo card ── */
function repoCardHTML(r){
  const url=safeUrl(r.html_url);if(!url)return'';
  const lang=r.language||'';
  return`<a class="repo-card" href="${url}" target="_blank" rel="noopener noreferrer">
    <div class="repo-name">${esc(r.name)}</div>
    ${r.description?`<div class="repo-desc">${esc(r.description)}</div>`:''}
    <div class="repo-meta">
      ${lang?`<span class="lang-dot ${langClass(lang)}"></span><span>${esc(lang)}</span>`:''}
      ${r.stargazers_count>0?`<span>★ ${fmtNum(r.stargazers_count)}</span>`:''}
      ${r.forks_count>0?`<span>⑂ ${fmtNum(r.forks_count)}</span>`:''}
    </div>
  </a>`;
}

/* ── Favorites ── */
function toggleFav(user){
  if(isFav(user.login)){
    favorites=favorites.filter(f=>f.login!==user.login);
    toast('@'+user.login+' retiré des favoris','info');
  }else{
    favorites.push({login:user.login,name:user.name||user.login,avatar:safeUrl(user.avatar_url)||''});
    toast('@'+user.login+' ajouté ★','success');
  }
  saveFavs();updateBadge();
  const btn=document.getElementById('btn-fav-toggle');
  if(btn){const f=isFav(user.login);btn.className='btn btn-fav'+(f?' is-fav':'');btn.textContent=f?'★ Favori':'☆ Ajouter'}
  if(panelOverlay.classList.contains('open'))renderFavPanel();
}

function renderFavPanel(){
  updateBadge();
  if(!favorites.length){
    favList.innerHTML=`<div class="empty-fav"><span class="empty-ico">☆</span>Aucun favori.<br>Recherchez et ajoutez des profils.</div>`;
    panelFooter.style.display='none';return;
  }
  favList.innerHTML=favorites.map((f,i)=>`
    <div class="fav-item" data-i="${i}">
      <img class="fav-avatar" src="${esc(f.avatar)}" alt="${esc(f.login)}" width="36" height="36"
        onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2236%22><rect width=%2236%22 height=%2236%22 fill=%22%230f0f12%22/></svg>'" />
      <div class="fav-info">
        <div class="fav-name">${esc(f.name)}</div>
        <div class="fav-login">@${esc(f.login)}</div>
      </div>
      <button class="fav-del" data-login="${esc(f.login)}" aria-label="Retirer ${esc(f.login)}">✕</button>
    </div>
  `).join('');
  panelFooter.style.display='block';
  favList.querySelectorAll('.fav-item').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.classList.contains('fav-del'))return;
      const l=favorites[parseInt(el.getAttribute('data-i'),10)]?.login;
      if(l){closePanel();searchInput.value=l;doSearch()}
    });
  });
  favList.querySelectorAll('.fav-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const l=btn.getAttribute('data-login');
      favorites=favorites.filter(f=>f.login!==l);saveFavs();renderFavPanel();
      if(currentUser&&currentUser.login===l){const b=document.getElementById('btn-fav-toggle');if(b){b.className='btn btn-fav';b.textContent='☆ Ajouter'}}
      toast('@'+l+' retiré','info');
    });
  });
}

/* ── Panel ── */
function openPanel(){renderFavPanel();panelOverlay.classList.add('open');btnFavs.classList.add('active')}
function closePanel(){panelOverlay.classList.remove('open');btnFavs.classList.remove('active')}
panelOverlay.addEventListener('click',e=>{if(e.target===panelOverlay)closePanel()});
btnClosePanel.addEventListener('click',closePanel);
btnFavs.addEventListener('click',()=>panelOverlay.classList.contains('open')?closePanel():openPanel());
btnClearFavs.addEventListener('click',()=>{
  if(!confirm('Vider tous les favoris ?'))return;
  favorites=[];saveFavs();renderFavPanel();updateBadge();
  if(currentUser){const b=document.getElementById('btn-fav-toggle');if(b){b.className='btn btn-fav';b.textContent='☆ Ajouter'}}
  toast('Favoris vidés','warn');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

/* ── API ── */
const HDRS={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};

async function fetchUser(login){
  const r=await fetch(`https://api.github.com/users/${encodeURIComponent(login)}`,{headers:HDRS,signal:abortCtrl.signal});
  parseRateHeaders(r);
  if(r.status===404)throw Object.assign(new Error('Utilisateur introuvable sur GitHub.'),{status:404});
  if(r.status===403)throw Object.assign(new Error('Limite API GitHub atteinte. Réessayez dans quelques minutes.'),{status:403});
  if(!r.ok)throw new Error('Erreur serveur ('+r.status+'). Réessayez.');
  return r.json();
}
async function fetchRepos(login){
  try{
    const r=await fetch(`https://api.github.com/users/${encodeURIComponent(login)}/repos?sort=stars&direction=desc&per_page=6`,{headers:HDRS,signal:abortCtrl.signal});
    if(!r.ok)return[];return r.json();
  }catch{return[]}
}

/* ── Search ── */
async function doSearch(){
  const raw=searchInput.value.trim();
  const login=safeLogin(raw);
  if(!login){errorMsg.textContent='Entrez un pseudo GitHub valide.';showView('error');return}
  if(abortCtrl)abortCtrl.abort();
  abortCtrl=new AbortController();
  closeHistDrop();addToHist(login);
  btnSearch.disabled=true;btnSearch.textContent='...';
  profileCard.innerHTML=skelHTML();showView('results');
  await new Promise(r=>setTimeout(r,80));
  try{
    const[user,repos]=await Promise.all([fetchUser(login),fetchRepos(login)]);
    renderProfile(user,repos);
  }catch(err){
    if(err.name==='AbortError')return;
    let msg=err.message||'Erreur inconnue.';
    if(err instanceof TypeError)msg='Connexion impossible. Vérifiez votre réseau.';
    errorMsg.textContent=msg;showView('error');
  }finally{
    btnSearch.disabled=false;btnSearch.textContent='CHERCHER';
  }
}

/* ── Events ── */
btnSearch.addEventListener('click',doSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){closeHistDrop();doSearch()}if(e.key==='Escape')closeHistDrop()});
searchInput.addEventListener('input',()=>{
  const c=searchInput.value.replace(/[^a-zA-Z0-9\-]/g,'');if(searchInput.value!==c)searchInput.value=c;closeHistDrop();
});
searchInput.addEventListener('focus',()=>{if(!searchInput.value&&history.length)showHistDrop()});
document.addEventListener('click',e=>{if(!$('searchWrap').contains(e.target))closeHistDrop()});

/* ── Init ── */
updateBadge();updateRateUI();fetchRateLimit();showView('welcome');
})();
</script>
</body>
</html>
